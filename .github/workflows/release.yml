name: Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "GitHub Release oluştur"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: kaiwen-project-starter-unsigned
          path: release/*
          if-no-files-found: error
      - name: Manuel GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kaiwen Project Starter v${{ github.run_number }}
          body: |
            Manuel olarak üretilmiş Windows paketi.

            Bilinen kısıt: Kod imzalama kimliği yapılandırılmadıysa installer imzasızdır ve SmartScreen uyarısı gösterebilir.
          files: release/*
