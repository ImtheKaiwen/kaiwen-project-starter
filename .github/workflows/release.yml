name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Uygulamayı derle
        run: npm run build
      - name: Sürüm etiketini hazırla
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          git fetch --tags --force
          $existing = git rev-list -n 1 $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne $env:GITHUB_SHA) { throw "$tag etiketi başka bir commit'e ait." }
          } else {
            git tag $tag $env:GITHUB_SHA
            git push origin $tag
          }
      - name: Windows paketini ve GitHub Release'i yayınla
        run: npx electron-builder --win nsis --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: kaiwen-project-starter-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
